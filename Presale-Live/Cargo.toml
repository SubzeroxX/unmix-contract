[workspace]
members = [
    "programs/*"
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[patch.crates-io]
# This syntax tells Cargo: "When you look for blake3 on crates.io, use this specific version"
# We use the git URL as a workaround to the 'same source' error if the version pin fails
blake3 = { git = "https://github.com/BLAKE3-team/BLAKE3", tag = "1.5.5" }